plugins { id 'com.android.application' }
android {
 namespace 'xyz.minaghali.engym'
 compileSdk 35
 defaultConfig { applicationId 'xyz.minaghali.engym'; minSdk 29; targetSdk 35; versionCode 1; versionName '1.0.0' }
 signingConfigs { release {
  storeFile file(System.getenv('ENGYM_KEYSTORE_PATH') ?: '/signing/engym-release.jks')
  storePassword System.getenv('ENGYM_SIGNING_PASSWORD')
  keyAlias 'engym'
  keyPassword System.getenv('ENGYM_SIGNING_PASSWORD')
 } }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}

dependencies { implementation 'androidx.webkit:webkit:1.12.1'; implementation 'androidx.core:core:1.13.1' }
