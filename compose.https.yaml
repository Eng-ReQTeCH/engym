services:
  engym:
    ports: !reset []
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ENGYM_DOMAIN: ${ENGYM_DOMAIN:?Set ENGYM_DOMAIN to your public hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - engym
volumes:
  caddy-data:
  caddy-config:
